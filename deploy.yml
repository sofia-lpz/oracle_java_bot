version: 0.1 
component: build
timeoutInSeconds: 600
shell: bash
env:
  exportedVariables:
    - BuildServiceDemoVersion
steps:
  - type: Command
    name: "Download and Extract CI Credentials"
    command: |
      oci os object get --bucket-name ci_creds --name Deploy_Creds.tar --file Deploy_Creds.tar
      tar -xvf Deploy_Creds.tar
      ls
      pwd
  - type: Command
    name: "Move Wallet to Backend Source"
    command: |
      if [ -d "Wallet" ]; then
        cp -r ./Deploy_Creds/Wallet integration/agile-organizer/MtdrSpring/backend/src/
        echo "Wallet copied to integration/agile-organizer/MtdrSpring/backend/src/"
      else
        echo "Wallet directory not found"
        exit 1
      fi
  - type: Command
    name: "Copy Application Properties"
    command: |
      if [ -f "application.properties" ]; then
        cp ./Deploy_Creds/application.properties integration/agile-organizer/MtdrSpring/backend/src/main/resources/
        echo "Application properties copied to integration/agile-organizer/MtdrSpring/backend/src/main/resources/"
      else
        echo "application.properties not found"
        exit 1
      fi
  - type: Command
    name: "Extract and Move Maven"
    command: |
      if [ -f "maven.tar.gz" ]; then
        
       
          cp -r ./Deploy_Creds/maven.tar.gz integration/agile-organizer/MtdrSpring/backend/
          echo "Maven copied to integration/agile-organizer/MtdrSpring/backend/"
        else
          echo "Maven directory not found after extraction"
          exit 1
        fi
      else
        echo "maven.tar.gz not found"
        exit 1
      fi
  - type: Command
    name: "Docker Login"
    command: |
      if [ -f "login_docker.sh" ]; then
        chmod +x login_docker.sh
        ./Deploy_Creds/login_docker.sh
      else
        echo "login_docker.sh not found"
        exit 1
      fi
  - type: Command
    name: "Build"
    command: |
      cd integration/agile-organizer/MtdrSpring
      (cd backend; source build.sh)